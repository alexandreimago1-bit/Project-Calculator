<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Stles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="reset.css">
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Project - Calculator</title>
</head>
<body>
<div class="flexContainer">
    <div class="characterBox">
        <p class="operationCharacters"></p>
        <p class="answer"></p>
    </div>
    <div class="btnContainer">
        <div class="firstRow">
            <button class="btn function" id="clearBtn">AC</button>
            <button class="btn function" id="percentBtn">&#x25;</button>
            <button class="btn function" id="backspaceBtn">&#x232B;</button>
            <button class="btn operation" id="divisionBtn">&#247;</button>
        </div>
        <div class="secondRow">
            <button class="btn digit" id="digitSeven">7</button>
            <button class="btn digit" id="digitEight">8</button>
            <button class="btn digit" id="digitNine">9</button>
            <button class="btn operation" id="multiplyBtn">&#xD7;</button>
        </div>
        <div class="thirdRow">
            <button class="btn digit" id="digitFour">4</button>
            <button class="btn digit" id="digitFive">5</button>
            <button class="btn digit" id="digitSix">6</button>
            <button class="btn operation" id="addBtn">&#x2B;</button>
        </div>
        <div class="fourthRow">
            <button class="btn digit" id="digitOne">1</button>
            <button class="btn digit" id="digitTwo">2</button>
            <button class="btn digit" id="digitThree">3</button>
            <button class="btn operation" id="minusBtn">&#x2212;</button>
        </div>
        <div class="fifthRow">
            <button class="btn digit" id="digitZero">0</button>
            <button class="btn digit" id="decimalBtn">&#x2E;</button>
            <button class="btn operation equals" id="equalBtn">&#61;</button>
        </div>
        
    </div>
</div>

    <!-- script -->
     <script src="calculator.js"></script>
</body>
</html>
